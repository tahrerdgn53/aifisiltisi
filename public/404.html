<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <script>
      const path = window.location.pathname;
      const search = window.location.search;
      const hash = window.location.hash;

      sessionStorage.setItem(
        "spa-redirect",
        path + search + hash
      );

      window.location.replace("/");
    </script>
  </head>
  <body></body>
</html>
